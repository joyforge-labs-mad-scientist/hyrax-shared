[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyrax-shared"
version = "0.1.0"
description = "Shared Python utilities for the Hyrax pre-KYB pipeline (SSRF URL safety, etc.)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "JoyForge Labs"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock>=3"]

[project.urls]
Homepage = "https://github.com/joyforge-labs-mad-scientist/hyrax-shared"
Issues = "https://github.com/joyforge-labs-mad-scientist/hyrax-shared/issues"

[tool.setuptools]
packages = ["hyrax_shared"]
